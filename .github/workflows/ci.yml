name: SliceDeck CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication and deployment so another run cannot move :latest
# while the preceding deployment is checking it.
concurrency:
  group: slicedeck-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish the existing Docker Hub image
        id: push
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_USER" && test -n "$DOCKERHUB_TOKEN" || { echo 'Docker Hub credentials are required' >&2; exit 1; }
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
          version=$(python3 -c 'import re; print(re.search(r"^VERSION = \"([^\"]+)\"", open("app/config.py").read(), re.M).group(1))')
          image=pank85/print-portal
          short=${SHA:0:8}
          docker build --platform linux/amd64 -t "$image:$short" -t "$image:$version-$short" -t "$image:latest" .
          for tag in "$short" "$version-$short" latest; do docker push "$image:$tag"; done
          digest=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image:latest" | grep -F "$image@sha256:" | head -n1)
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs: publish
    # A trusted runner with LAN access must be explicitly provisioned and labelled.
    runs-on: [self-hosted, linux, slicedeck-deploy]
    environment: production
    steps:
      - name: Pull, restart and verify the exact published image
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY_BASE64 }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DIGEST" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" || { echo 'Missing deployment digest or SSH secrets' >&2; exit 1; }
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          printf '%s' "$SSH_KEY" | base64 -d > "$tmp/key"
          printf '%s' "$KNOWN_HOSTS" | base64 -d > "$tmp/known_hosts"
          chmod 600 "$tmp/key" "$tmp/known_hosts"
          ssh=(ssh -i "$tmp/key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$tmp/known_hosts" pank@172.16.0.50)
          "${ssh[@]}" 'cd /home/pank/homeserver/docker-compose/print-portal && sudo docker compose pull && sudo systemctl restart docker-compose@print-portal'
          "${ssh[@]}" 'i=0; while [ "$i" -lt 90 ]; do st=$(sudo docker inspect -f "{{.State.Health.Status}}" print-portal 2>/dev/null || echo missing); [ "$st" = healthy ] && exit 0; i=$((i+1)); sleep 2; done; echo "health=$st"; exit 1'
          repo=${DIGEST%@*}
          pulled=$("${ssh[@]}" "sudo docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' '$repo:latest'")
          printf '%s\n' "$pulled" | grep -Fx "$DIGEST"
          image_id=$("${ssh[@]}" "sudo docker image inspect -f '{{.Id}}' '$repo:latest'")
          running=$("${ssh[@]}" "sudo docker inspect -f '{{.Config.Image}} {{.Image}} {{.State.Status}}' print-portal")
          test "$running" = "$repo:latest $image_id running"
